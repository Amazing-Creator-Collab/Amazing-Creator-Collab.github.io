<!DOCTYPE html>
<html>
<head>
  <title>Mr Hai — Skill Hunter</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #f0e6d2;
      font-family: Georgia, serif;
      max-width: 700px;
      margin: 80px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #e8a33d;
      font-size: 2.5em;
      margin-bottom: 0;
    }
    .subtitle {
      color: #999;
      font-style: italic;
      margin-top: 5px;
    }
    .bio {
      margin-top: 30px;
      font-size: 1.1em;
    }
    .tag {
      display: inline-block;
      background-color: #e8a33d;
      color: #1a1a1a;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 20px;
      font-size: 0.9em;
      font-weight: bold;
    }
    .links {
      margin-top: 40px;
    }
    .links a {
      color: #e8a33d;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #e8a33d;
      padding: 8px 16px;
      border-radius: 6px;
    }
    .links a:hover {
      background-color: #e8a33d;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <h1>Mr Hai</h1>
  <p class="subtitle">Hunter of useful skills</p>

  <div class="bio">
    <p>I don't hunt in jungles. I hunt in the feed.</p>
    <p>Social media is my hunting ground — I go deep looking for skills worth catching, ideas worth keeping, and knowledge worth building on.</p>
  </div>

  <span class="tag">🎯 Currently hunting: new skills</span>

  <div class="links">
    <a href="https://www.linkedin.com/in/chaidir-s-pd-gr-0b7404190" target="_blank">Connect on LinkedIn →</a>
  </div>
</body>
</html>
